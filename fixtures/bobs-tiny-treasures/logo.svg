<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" role="img" aria-label="Bob's Tiny Treasures logo">
  <title>Bob's Tiny Treasures</title>
  <defs>
    <!-- Amber glow filter for the chat bubble -->
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle drop shadow for gems -->
    <filter id="gem-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Gradient fill for the chat bubble face -->
    <linearGradient id="bubble-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Inner face-plate gradient -->
    <linearGradient id="faceplate-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- ── Chat-bubble head (the AI face) ──────────────────────────────── -->

  <!-- Outer bubble body — rounded rectangle, amber gold -->
  <rect x="14" y="10" width="100" height="84" rx="18" ry="18"
        fill="url(#bubble-fill)" stroke="#d97706" stroke-width="2"
        filter="url(#amber-glow)"/>

  <!-- Speech-bubble tail pointing down-right -->
  <path d="M 72 94 L 88 112 L 60 94 Z"
        fill="#f59e0b" stroke="#d97706" stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Inner dark screen / terminal area -->
  <rect x="24" y="20" width="80" height="66" rx="12" ry="12"
        fill="url(#faceplate-fill)" stroke="#334155" stroke-width="1.5"/>

  <!-- ── Face expression inside the dark screen ──────────────────────── -->

  <!-- Left eye dot -->
  <circle cx="47" cy="45" r="5" fill="#f59e0b"/>
  <!-- Left eye glint -->
  <circle cx="49" cy="43" r="1.5" fill="#fde68a" opacity="0.9"/>

  <!-- Right eye dot -->
  <circle cx="81" cy="45" r="5" fill="#f59e0b"/>
  <!-- Right eye glint -->
  <circle cx="83" cy="43" r="1.5" fill="#fde68a" opacity="0.9"/>

  <!-- Gentle smile — soft arc -->
  <path d="M 44 60 Q 64 74 84 60"
        stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"
        fill="none"/>

  <!-- ── "..." typing indicator — universally recognised as AI thinking ── -->
  <!-- Three pulsing dots in a subtle pill at the bottom of the screen -->
  <rect x="42" y="72" width="44" height="11" rx="5.5"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="53"  cy="77.5" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="64"  cy="77.5" r="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="75"  cy="77.5" r="3" fill="#f59e0b"/>

  <!-- ── Tiny Treasures gems — presented below / around the bubble ─────── -->

  <!-- Green gem (left) — cube-faceted diamond -->
  <g transform="translate(12, 116) rotate(-12)" filter="url(#gem-shadow)">
    <polygon points="0,-11 10,0 0,11 -10,0"
             fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <!-- Top facet highlight -->
    <polygon points="0,-11 10,0 0,-2"
             fill="#4ade80" opacity="0.55"/>
    <!-- Shine streak -->
    <line x1="-3" y1="-6" x2="1" y2="-9" stroke="white" stroke-width="1.3"
          stroke-linecap="round" opacity="0.75"/>
  </g>
  <!-- Green sparkle arms -->
  <line x1="4"  y1="100" x2="1"  y2="96" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="4"  y1="100" x2="8"  y2="96" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="4"  y1="100" x2="1"  y2="104" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="4"  y1="100" x2="8"  y2="104" stroke="#86efac" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Blue gem (centre) — slightly above, floating -->
  <g transform="translate(64, 112) rotate(8)" filter="url(#gem-shadow)">
    <polygon points="0,-12 11,0 0,12 -11,0"
             fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <polygon points="0,-12 11,0 0,-3"
             fill="#93c5fd" opacity="0.5"/>
    <line x1="-3" y1="-7" x2="2" y2="-10" stroke="white" stroke-width="1.3"
          stroke-linecap="round" opacity="0.75"/>
  </g>
  <!-- Blue sparkle arms -->
  <line x1="64" y1="96"  x2="60" y2="92" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="64" y1="96"  x2="68" y2="92" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="64" y1="96"  x2="60" y2="100" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="64" y1="96"  x2="68" y2="100" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Red gem (right) -->
  <g transform="translate(116, 116) rotate(18)" filter="url(#gem-shadow)">
    <polygon points="0,-11 10,0 0,11 -10,0"
             fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <polygon points="0,-11 10,0 0,-2"
             fill="#fca5a5" opacity="0.5"/>
    <line x1="-3" y1="-6" x2="1" y2="-9" stroke="white" stroke-width="1.3"
          stroke-linecap="round" opacity="0.75"/>
  </g>
  <!-- Red sparkle arms -->
  <line x1="116" y1="101" x2="112" y2="97"  stroke="#fca5a5" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="116" y1="101" x2="120" y2="97"  stroke="#fca5a5" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="116" y1="101" x2="112" y2="105" stroke="#fca5a5" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <line x1="116" y1="101" x2="120" y2="105" stroke="#fca5a5" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- ── Separator ──────────────────────────────────────────────────────── -->
  <line x1="137" y1="18" x2="137" y2="118"
        stroke="#334155" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────────── -->

  <!-- "Bob's Tiny" — bold warm white -->
  <text x="150" y="58"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="800" fill="#f8fafc"
        letter-spacing="-0.5">Bob's Tiny</text>

  <!-- "Treasures" — amber gold, slightly larger -->
  <text x="150" y="95"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="36" font-weight="800" fill="#f59e0b"
        letter-spacing="-1">Treasures</text>

  <!-- Tagline — muted slate, spaced caps -->
  <text x="152" y="114"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="11" font-weight="400" fill="#94a3b8"
        letter-spacing="2.5">WAREHOUSE  EDITION</text>

</svg>
