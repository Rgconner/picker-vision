<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" role="img" aria-label="Bob's Tiny Treasures logo">
  <title>Bob's Tiny Treasures</title>

  <!-- ── Robot body (Bob) ──────────────────────────────────────────── -->

  <!-- Antenna post -->
  <line x1="58" y1="18" x2="58" y2="30" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna ball -->
  <circle cx="58" cy="13" r="5" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Antenna sparkle arms -->
  <line x1="58" y1="13" x2="52" y2="7"  stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="13" x2="64" y2="7"  stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="13" x2="58" y2="5"  stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>

  <!-- Head / face — rounded rectangle -->
  <rect x="30" y="28" width="56" height="52" rx="12" ry="12"
        fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Face plate (slightly recessed lighter panel) -->
  <rect x="36" y="34" width="44" height="36" rx="8" ry="8"
        fill="#fcd34d" stroke="#d97706" stroke-width="1"/>

  <!-- Left eye — open circle -->
  <circle cx="50" cy="52" r="7" fill="white" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="50" cy="52" r="3.5" fill="#1e293b"/>
  <circle cx="51.5" cy="50" r="1.2" fill="white"/>

  <!-- Right eye — winking (arc) -->
  <path d="M 62 48 Q 66 44 70 48" stroke="#92400e" stroke-width="2.5"
        stroke-linecap="round" fill="none"/>
  <!-- Wink lashes -->
  <line x1="62" y1="48" x2="61" y2="51" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="48" x2="71" y2="51" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 46 64 Q 58 72 70 64" stroke="#92400e" stroke-width="2"
        stroke-linecap="round" fill="none"/>

  <!-- Ears -->
  <rect x="18" y="42" width="12" height="16" rx="4" ry="4"
        fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <rect x="86" y="42" width="12" height="16" rx="4" ry="4"
        fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="50" y="80" width="16" height="8" rx="3" fill="#d97706"/>

  <!-- Body / torso -->
  <rect x="32" y="88" width="52" height="30" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>

  <!-- Chest panel -->
  <rect x="40" y="93" width="36" height="18" rx="5" fill="#fcd34d" stroke="#d97706" stroke-width="1"/>

  <!-- Chest buttons -->
  <circle cx="50" cy="102" r="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
  <circle cx="58" cy="102" r="3" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
  <circle cx="66" cy="102" r="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Arms -->
  <rect x="12" y="90" width="20" height="10" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <rect x="84" y="90" width="20" height="10" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>

  <!-- Hands (holding gems) -->
  <circle cx="16" cy="108" r="7" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="100" cy="108" r="7" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>

  <!-- ── Tiny Treasures gems (tumbling from hands) ──────────────────── -->

  <!-- Green gem — left hand, tumbling up-left -->
  <g transform="translate(4, 88) rotate(-20)">
    <rect x="-7" y="-7" width="14" height="14" rx="2"
          fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <!-- shine -->
    <line x1="-3" y1="-3" x2="0" y2="-5" stroke="white" stroke-width="1.2"
          stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Green sparkle -->
  <text x="0" y="76" font-size="8" fill="#86efac" opacity="0.9">✦</text>

  <!-- Red gem — right hand, tumbling up-right -->
  <g transform="translate(112, 85) rotate(15)">
    <rect x="-7" y="-7" width="14" height="14" rx="2"
          fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="-3" y1="-3" x2="0" y2="-5" stroke="white" stroke-width="1.2"
          stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Red sparkle -->
  <text x="113" y="73" font-size="8" fill="#fca5a5" opacity="0.9">✦</text>

  <!-- Blue gem — floating above, centre -->
  <g transform="translate(58, 10) rotate(10)">
    <!-- diamond shape -->
    <polygon points="0,-10 9,0 0,10 -9,0"
             fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="-2" y1="-5" x2="2" y2="-7" stroke="white" stroke-width="1.2"
          stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Blue sparkle -->
  <text x="68" y="12" font-size="7" fill="#93c5fd" opacity="0.9">✦</text>

  <!-- ── Wordmark ────────────────────────────────────────────────────── -->

  <!-- "Bob's Tiny" -->
  <text x="148" y="62"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="800" fill="#f8fafc"
        letter-spacing="-0.5">Bob's Tiny</text>

  <!-- "Treasures" — amber gold, slightly larger -->
  <text x="148" y="96"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="36" font-weight="800" fill="#f59e0b"
        letter-spacing="-1">Treasures</text>

  <!-- Tagline -->
  <text x="150" y="114"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="11" font-weight="400" fill="#94a3b8"
        letter-spacing="2">WAREHOUSE  EDITION</text>

  <!-- Thin separator line between icon and wordmark -->
  <line x1="136" y1="35" x2="136" y2="115"
        stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

</svg>
