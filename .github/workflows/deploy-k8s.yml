name: Deploy to Kubernetes

on:
  # Auto-deploy when the build workflow completes on any branch.
  # NOTE: workflow_run is evaluated from the default branch (main), so this
  # workflow file must be merged to main for the trigger to fire.
  # Branch discrimination (prod vs test namespace) is handled in the job steps.
  workflow_run:
    workflows: ["Build Server Images"]
    types: [completed]
  # Manual deploy — choose branch/namespace explicitly
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-a1b2c3d or main)"
        required: false
        default: "main"
      target_branch:
        description: "Branch to target: 'main' → prod namespace, 'feature/mobile-web-client' → test namespace"
        required: false
        default: "main"

jobs:
  deploy:
    name: Deploy to k8s
    runs-on: ubuntu-latest
    # Only deploy when the triggering build succeeded (or on manual dispatch)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      # Write the kubeconfig from a repository secret.
      # In GitHub: Settings → Secrets → KUBECONFIG  (base64-encoded kubeconfig)
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Resolve the image tag and branch context from the triggering build.
      # workflow_dispatch exposes both inputs explicitly; workflow_run reads
      # head_sha and head_branch from the upstream build event.
      - name: Resolve image tag and branch
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "branch=${{ inputs.target_branch }}" >> $GITHUB_OUTPUT
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=sha-$(echo ${SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          fi

      # ── Production deploy (main branch only) ─────────────────────────────────

      - name: Update production image tags
        if: steps.tag.outputs.branch == 'main'
        working-directory: k8s
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kustomize edit set image \
            ghcr.io/rgconner/picker-vision/api-gateway=ghcr.io/rgconner/picker-vision/api-gateway:${TAG} \
            ghcr.io/rgconner/picker-vision/order-service=ghcr.io/rgconner/picker-vision/order-service:${TAG} \
            ghcr.io/rgconner/picker-vision/event-processor=ghcr.io/rgconner/picker-vision/event-processor:${TAG} \
            ghcr.io/rgconner/picker-vision/websocket-hub=ghcr.io/rgconner/picker-vision/websocket-hub:${TAG} \
            ghcr.io/rgconner/picker-vision/web-ui=ghcr.io/rgconner/picker-vision/web-ui:${TAG}

      - name: Apply MetalLB config
        if: steps.tag.outputs.branch == 'main'
        # --validate=false: MetalLB CRD types (metallb.io/v1beta1) are not in
        # kubectl's built-in schema. Without this flag kubectl tries to fetch the
        # OpenAPI schema from localhost:8080, which doesn't exist on the runner.
        run: kubectl apply --validate=false -f k8s/metallb-config.yaml

      - name: Apply production manifests
        if: steps.tag.outputs.branch == 'main'
        run: kubectl apply -k k8s/

      - name: Wait for production rollout
        if: steps.tag.outputs.branch == 'main'
        run: |
          for deploy in api-gateway order-service event-processor websocket-hub web-ui; do
            echo "Waiting for $deploy..."
            kubectl rollout status deployment/$deploy -n picker-vision --timeout=300s
          done

      - name: Show production external IPs
        if: steps.tag.outputs.branch == 'main'
        run: |
          echo "### Production External IPs (MetalLB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n picker-vision -o wide | grep LoadBalancer >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ── Test namespace deploy (feature/mobile-web-client branch) ─────────────
      # Pins to the exact SHA tag so pods always restart on a new build,
      # regardless of whether the mutable branch tag changed.

      - name: Update test overlay image tags
        if: steps.tag.outputs.branch == 'feature/mobile-web-client'
        working-directory: k8s/overlays/test
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kustomize edit set image \
            ghcr.io/rgconner/picker-vision/api-gateway=ghcr.io/rgconner/picker-vision/api-gateway:${TAG} \
            ghcr.io/rgconner/picker-vision/order-service=ghcr.io/rgconner/picker-vision/order-service:${TAG} \
            ghcr.io/rgconner/picker-vision/event-processor=ghcr.io/rgconner/picker-vision/event-processor:${TAG} \
            ghcr.io/rgconner/picker-vision/websocket-hub=ghcr.io/rgconner/picker-vision/websocket-hub:${TAG} \
            ghcr.io/rgconner/picker-vision/web-ui=ghcr.io/rgconner/picker-vision/web-ui:${TAG}

      - name: Apply test MetalLB pool
        if: steps.tag.outputs.branch == 'feature/mobile-web-client'
        # --validate=false: same CRD schema reason as production MetalLB step above.
        run: kubectl apply --validate=false -f k8s/overlays/test/metallb-pool.yaml

      - name: Apply test manifests
        if: steps.tag.outputs.branch == 'feature/mobile-web-client'
        run: kubectl apply -k k8s/overlays/test/

      - name: Wait for test rollout
        if: steps.tag.outputs.branch == 'feature/mobile-web-client'
        run: |
          for deploy in api-gateway order-service event-processor websocket-hub web-ui; do
            echo "Waiting for $deploy (test)..."
            kubectl rollout status deployment/$deploy -n picker-vision-test --timeout=300s
          done

      - name: Show test external IPs
        if: steps.tag.outputs.branch == 'feature/mobile-web-client'
        run: |
          echo "### Test External IPs (MetalLB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n picker-vision-test -o wide | grep LoadBalancer >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
