name: CI — Lint & Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    name: Python syntax & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No requirements.txt — dependencies installed inline below.
          # Omitting 'cache: pip' avoids the "no requirements file found" warning.

      # Install only what's needed for static checks — no heavy CV packages.
      - name: Install lint dependencies
        run: |
          pip install --quiet \
            fastapi \
            httpx \
            sqlalchemy \
            redis \
            pydantic \
            flake8

      - name: Syntax check — all Python files
        run: |
          echo "### Python syntax check" >> $GITHUB_STEP_SUMMARY
          find . -path ./server/web_ui -prune -o -name "*.py" -print | sort | while read f; do
            python -m py_compile "$f" && echo "  ✅ $f" || echo "  ❌ $f"
          done >> $GITHUB_STEP_SUMMARY
          # Fail the step if any compile errors
          find . -path ./server/web_ui -prune -o -name "*.py" -print | xargs python -m py_compile

      - name: Flake8 lint — server services
        run: |
          flake8 server \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E402 \
            --exclude=server/web_ui \
            --format="::warning file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s"

      - name: Flake8 lint — Pi node
        run: |
          flake8 pi-node \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --format="::warning file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s"

  typescript-check:
    name: TypeScript build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/web_ui/package.json

      - name: Install dependencies
        working-directory: server/web_ui
        run: npm ci

      - name: TypeScript build
        working-directory: server/web_ui
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-dist
          path: server/web_ui/dist/
          retention-days: 7
