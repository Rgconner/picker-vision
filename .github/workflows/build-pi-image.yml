name: Build Pi Node Image (ARM64)

on:
  push:
    branches:
      - main
      - feature/mobile-web-client
    paths:
      - "pi-node/**"
      - ".github/workflows/build-pi-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "pi-node/**"
      - ".github/workflows/build-pi-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pi-node

jobs:
  build:
    name: Build Pi Node (linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU allows the amd64 runner to emulate ARM64 for the build stage.
      # The resulting image is a native arm64 image that runs on a Pi 4/5.
      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Pi Node image
        uses: docker/build-push-action@v5
        with:
          context: pi-node
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ARM64 builds are slow under QEMU — layer cache is essential
          cache-from: type=gha,scope=pi-node
          cache-to: type=gha,scope=pi-node,mode=max

      # Emit a summary so the build duration is visible in the workflow run page.
      # ARM64 pip installs (opencv, zxingcpp) typically take 8–15 min on first run.
      - name: Build summary
        if: always()
        run: |
          echo "### Pi Node Image" >> $GITHUB_STEP_SUMMARY
          echo "Platform: \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "Pushed: \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull the image on your Pi:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
