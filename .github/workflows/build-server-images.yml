name: Build Server Images

on:
  push:
    branches:
      - main
      - feature/mobile-web-client
    paths:
      - "server/**"
      - "k8s/**"
      - ".github/workflows/build-server-images.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "k8s/**"
      - ".github/workflows/build-server-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Images are published under the repository owner's namespace.
  # e.g.  ghcr.io/rgconner/picker-vision/api-gateway:main
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: server/api_gateway
          - service: order-service
            context: server/order_service
          - service: event-processor
            context: server/event_processor
          - service: websocket-hub
            context: server/websocket_hub
          - service: web-ui
            context: server/web_ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the runner's pre-installed Docker daemon as the buildx builder.
      # driver: docker avoids pulling moby/buildkit from Docker Hub on every run,
      # which eliminates the intermittent "Client.Timeout exceeded" bootstrap error.
      # Trade-off: GHA cache backend is not supported with the docker driver, so
      # cache-from/cache-to are removed below. Layer caching still works via the
      # daemon's own image cache across jobs on the same runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        # Only log in when pushing (not on pull_request from forks)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags:
      #   push to main  → :main  and  :sha-<short>
      #   version tag   → :1.2.3 and  :latest
      #   pull_request  → :pr-<number>  (not pushed)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Note: cache-from/cache-to (type=gha) is not supported with driver: docker.
          # The daemon image cache still avoids redundant layer pulls within a run.
