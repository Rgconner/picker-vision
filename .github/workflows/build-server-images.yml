name: Build Server Images

on:
  push:
    branches:
      - main
      - feature/mobile-web-client
    paths:
      - "server/**"
      - "k8s/**"
      - ".github/workflows/build-server-images.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "k8s/**"
      - ".github/workflows/build-server-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: server/api_gateway
          - service: order-service
            context: server/order_service
          - service: event-processor
            context: server/event_processor
          - service: websocket-hub
            context: server/websocket_hub
          - service: web-ui
            context: server/web_ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Deploy ────────────────────────────────────────────────────────────────────
  # Runs after ALL build matrix jobs pass, on push only (not PRs).
  # Triggered directly from this workflow — no workflow_run cross-workflow
  # dependency, which only fires from the default branch.
  deploy:
    name: Deploy to k8s
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Short SHA tag — same format as docker/metadata-action produces above
      - name: Resolve image tag
        id: tag
        run: echo "sha=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      # ── Production deploy (main) ──────────────────────────────────────────────

      - name: Apply MetalLB config (prod)
        if: github.ref_name == 'main'
        run: kubectl apply --validate=false -f k8s/metallb-config.yaml

      - name: Apply production manifests
        if: github.ref_name == 'main'
        run: kubectl apply -k k8s/

      - name: Pin production deployments to SHA tag
        if: github.ref_name == 'main'
        run: |
          TAG="${{ steps.tag.outputs.sha }}"
          NS=picker-vision
          for svc in api-gateway order-service event-processor websocket-hub web-ui; do
            kubectl set image deployment/${svc} ${svc}=ghcr.io/rgconner/picker-vision/${svc}:${TAG} -n ${NS}
          done

      - name: Wait for production rollout
        if: github.ref_name == 'main'
        run: |
          for deploy in api-gateway order-service event-processor websocket-hub web-ui; do
            kubectl rollout status deployment/${deploy} -n picker-vision --timeout=300s
          done

      - name: Show production external IPs
        if: github.ref_name == 'main'
        run: |
          echo "### Production External IPs (MetalLB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n picker-vision -o wide | grep LoadBalancer >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ── Test deploy (feature/mobile-web-client) ───────────────────────────────

      - name: Apply MetalLB pool (test)
        if: github.ref_name == 'feature/mobile-web-client'
        run: kubectl apply --validate=false -f k8s/overlays/test/metallb-pool.yaml

      - name: Apply test manifests
        if: github.ref_name == 'feature/mobile-web-client'
        run: kubectl apply -k k8s/overlays/test/

      - name: Pin test deployments to SHA tag
        if: github.ref_name == 'feature/mobile-web-client'
        run: |
          TAG="${{ steps.tag.outputs.sha }}"
          NS=picker-vision-test
          for svc in api-gateway order-service event-processor websocket-hub web-ui; do
            kubectl set image deployment/${svc} ${svc}=ghcr.io/rgconner/picker-vision/${svc}:${TAG} -n ${NS}
          done

      - name: Wait for test rollout
        if: github.ref_name == 'feature/mobile-web-client'
        run: |
          for deploy in api-gateway order-service event-processor websocket-hub web-ui; do
            kubectl rollout status deployment/${deploy} -n picker-vision-test --timeout=300s
          done

      - name: Show test external IPs
        if: github.ref_name == 'feature/mobile-web-client'
        run: |
          echo "### Test External IPs (MetalLB)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n picker-vision-test -o wide | grep LoadBalancer >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
