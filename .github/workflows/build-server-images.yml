name: Build Server Images

on:
  push:
    branches:
      - main
      - feature/mobile-web-client
      - feature/bobs-tiny-treasures
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: server/api_gateway
          - service: order-service
            context: server/order_service
          - service: event-processor
            context: server/event_processor
          - service: websocket-hub
            context: server/websocket_hub
          - service: web-ui
            context: server/web_ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

  # ── Deploy ────────────────────────────────────────────────────────────────────
  # Runs after ALL build matrix jobs pass, on push only (not PRs).
  # Triggered directly from this workflow — no workflow_run cross-workflow
  # dependency, which only fires from the default branch.
  deploy:
    name: Deploy to k8s
    needs: build
    runs-on: [self-hosted, picker-vision]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kubectl and kustomize are already installed on the self-hosted runner.
      # Kubeconfig is at the default ~/.kube/config location — no secret needed.

      # Short SHA tag — same format as docker/metadata-action produces above.
      # Use $env:GITHUB_SHA (always set) rather than ${{ github.sha }} template
      # substitution to avoid PowerShell 5.1 quoting/encoding edge cases.
      - name: Resolve image tag
        id: tag
        shell: powershell
        run: |
          $sha7 = $env:GITHUB_SHA.Substring(0, 7)
          $line = "sha=sha-$sha7"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $line -Encoding utf8
          Write-Host "Image tag resolved: $line"

      # ── Production deploy (main) ──────────────────────────────────────────────
      # MetalLB config is cluster-level infrastructure — applied once at setup,
      # not on every push.  The runner has direct LAN access to the cluster.

      - name: Apply production manifests
        if: github.ref_name == 'main'
        shell: powershell
        run: |
          & "C:\Users\RussConner\kubectl.exe" apply -k k8s/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin production deployments to SHA tag
        if: github.ref_name == 'main'
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.sha }}"
          $ns  = "picker-vision"
          foreach ($svc in @("api-gateway","order-service","event-processor","websocket-hub","web-ui")) {
            & "C:\Users\RussConner\kubectl.exe" set image deployment/$svc ${svc}=ghcr.io/rgconner/picker-vision/${svc}:$tag -n $ns
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Wait for production rollout
        if: github.ref_name == 'main'
        shell: powershell
        run: |
          foreach ($d in @("api-gateway","order-service","event-processor","websocket-hub","web-ui")) {
            & "C:\Users\RussConner\kubectl.exe" rollout status deployment/$d -n picker-vision --timeout=300s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Show production external IPs
        if: github.ref_name == 'main'
        shell: powershell
        run: |
          "### Production External IPs (MetalLB)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                                   | Out-File $env:GITHUB_STEP_SUMMARY -Append
          & "C:\Users\RussConner\kubectl.exe" get svc -n picker-vision -o wide | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                                   | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # ── Test deploy (feature/mobile-web-client) ───────────────────────────────
      # MetalLB pool is cluster-level infrastructure — applied once at setup.
      # The sandbox pool (192.168.11.0/24) already covers all test IPs.

      - name: Apply test manifests
        if: github.ref_name == 'feature/mobile-web-client'
        shell: powershell
        run: |
          & "C:\Users\RussConner\kubectl.exe" apply -k k8s/overlays/test/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin test deployments to SHA tag
        if: github.ref_name == 'feature/mobile-web-client'
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.sha }}"
          $ns  = "picker-vision-test"
          foreach ($svc in @("api-gateway","order-service","event-processor","websocket-hub","web-ui")) {
            & "C:\Users\RussConner\kubectl.exe" set image deployment/$svc ${svc}=ghcr.io/rgconner/picker-vision/${svc}:$tag -n $ns
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Wait for test rollout
        if: github.ref_name == 'feature/mobile-web-client'
        shell: powershell
        run: |
          foreach ($d in @("api-gateway","order-service","event-processor","websocket-hub","web-ui")) {
            & "C:\Users\RussConner\kubectl.exe" rollout status deployment/$d -n picker-vision-test --timeout=300s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Show test external IPs
        if: github.ref_name == 'feature/mobile-web-client'
        shell: powershell
        run: |
          "### Test External IPs (MetalLB)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                             | Out-File $env:GITHUB_STEP_SUMMARY -Append
          & "C:\Users\RussConner\kubectl.exe" get svc -n picker-vision-test -o wide | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                             | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # ── Bob's Tiny Treasures deploy (feature/bobs-tiny-treasures) ─────────────
      # Pin to SHA tag — same pattern as main/test.  The floating branch tag is
      # unreliable when Docker GHA cache reuses layers across commits; SHA tags
      # guarantee each commit deploys exactly what was built.

      - name: Apply Bob's Tiny Treasures manifests
        if: github.ref_name == 'feature/bobs-tiny-treasures'
        shell: powershell
        run: |
          & "C:\Users\RussConner\kubectl.exe" apply -f k8s/overlays/bobs-tiny-treasures/metallb-l2.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Users\RussConner\kubectl.exe" apply -k k8s/overlays/bobs-tiny-treasures/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin Bob's Tiny Treasures deployments to SHA tag
        if: github.ref_name == 'feature/bobs-tiny-treasures'
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.sha }}"
          $ns  = "picker-vision-btt"
          foreach ($svc in @("api-gateway","order-service","event-processor","websocket-hub","web-ui")) {
            & "C:\Users\RussConner\kubectl.exe" set image deployment/$svc ${svc}=ghcr.io/rgconner/picker-vision/${svc}:$tag -n $ns
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Wait for Bob's Tiny Treasures rollout
        if: github.ref_name == 'feature/bobs-tiny-treasures'
        shell: powershell
        run: |
          foreach ($d in @("api-gateway","order-service","event-processor","websocket-hub","web-ui")) {
            & "C:\Users\RussConner\kubectl.exe" rollout status deployment/$d -n picker-vision-btt --timeout=300s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Show Bob's Tiny Treasures external IPs
        if: github.ref_name == 'feature/bobs-tiny-treasures'
        shell: powershell
        run: |
          "### Bob's Tiny Treasures External IPs (MetalLB)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                                              | Out-File $env:GITHUB_STEP_SUMMARY -Append
          & "C:\Users\RussConner\kubectl.exe" get svc -n picker-vision-btt -o wide | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```'                                              | Out-File $env:GITHUB_STEP_SUMMARY -Append
