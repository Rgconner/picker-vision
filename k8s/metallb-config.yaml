---
# MetalLB IPAddressPool — addresses range must match your LAN subnet.
# This is configured for the 192.168.11.x subnet where the server lives at
# 192.168.11.7.  Adjust the range if your cluster node IPs differ.
# MetalLB will assign IPs from this pool to LoadBalancer Services.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: picker-vision-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.11.200-192.168.11.210
  # avoidBuggyIPs prevents .0 and .255 from being assigned
  avoidBuggyIPs: true
---
# L2Advertisement — announces the pool IPs via ARP/NDP on the LAN.
# This is the correct mode for a single-node or small bare-metal cluster
# where BGP peering is not available.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: picker-vision-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - picker-vision-pool
  # Optionally restrict which node interfaces advertise — leave empty for all
  # nodeSelectors: []
  # interfaces: []
