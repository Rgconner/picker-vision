---
# Self-signed CA issuer scoped to this namespace.
# cert-manager generates a private CA keypair; the Certificate below is signed by it.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: picker-vision-test
spec:
  selfSigned: {}
---
# TLS certificate for the web-ui.
# SAN includes the fixed MetalLB IP so Chrome accepts it (IP SANs are required).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-ui-tls
  namespace: picker-vision-test
spec:
  secretName: web-ui-tls-secret
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  commonName: picker-vision-test
  ipAddresses:
    - 192.168.11.212
  duration: 8760h    # 1 year
  renewBefore: 720h  # renew 30 days before expiry
