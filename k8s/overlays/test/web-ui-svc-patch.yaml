---
# Pin the web-ui LoadBalancer to .212 from the shared sandbox pool, expose HTTP + HTTPS
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.11.212
    metallb.universe.tf/address-pool: sandbox
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
