---
# Separate MetalLB pool for the test namespace so it never conflicts with
# the production picker-vision IPs (.200–.210).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: picker-vision-test-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.11.211-192.168.11.215
  avoidBuggyIPs: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: picker-vision-test-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - picker-vision-test-pool
