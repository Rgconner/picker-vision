---
# The sandbox pool (192.168.11.0/24) already covers the test IPs (.211/.212).
# A separate IPAddressPool would conflict. This L2Advertisement ensures the
# sandbox pool is announced on the network; services pin their IPs via the
# metallb.universe.tf/loadBalancerIPs annotation and reference sandbox directly.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: picker-vision-test-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - sandbox
