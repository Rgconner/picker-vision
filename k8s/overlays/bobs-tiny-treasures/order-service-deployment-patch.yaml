apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  # Recreate strategy — ensures old pod fully terminates before new pod starts.
  # Required because the SQLite PVC is ReadWriteOnce; simultaneous attach on two
  # nodes causes a Multi-Attach error that blocks the rolling deploy indefinitely.
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: order-service
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "256Mi"
