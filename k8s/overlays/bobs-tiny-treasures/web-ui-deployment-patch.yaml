apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  template:
    spec:
      containers:
        - name: web-ui
          ports:
            - containerPort: 80
            - containerPort: 443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: 443
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls-certs
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: web-ui-nginx-config
        - name: tls-certs
          secret:
            secretName: web-ui-tls-secret
