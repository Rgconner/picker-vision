apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: picker-vision-btt

resources:
  # BTT-specific namespace
  - namespace.yaml
  # All base manifests
  - ../../base
  # cert-manager Issuer + Certificate for the web-ui self-signed TLS cert
  - tls.yaml
  # MetalLB L2Advertisement (reuses sandbox pool, names its own advertisement)
  - metallb-l2.yaml
  # One-shot seed job — runs seed_btt.py after order-service is ready
  - seed-job.yaml

patches:
  # Override configmap: adds INSTANCE_PROFILE + BTT service URLs
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: picker-vision-config
  # Replace nginx config with BTT namespace FQDNs + HTTP (tunnel) + HTTPS (LAN) blocks
  - path: nginx-configmap-patch.yaml
    target:
      kind: ConfigMap
      name: web-ui-nginx-config
  # Mount TLS secret into web-ui pods and expose ports 80 + 443
  - path: web-ui-deployment-patch.yaml
    target:
      kind: Deployment
      name: web-ui
  # Pin api-gateway LoadBalancer to 192.168.11.213
  - path: api-gateway-svc-patch.yaml
    target:
      kind: Service
      name: api-gateway
  # Pin web-ui LoadBalancer to 192.168.11.214, expose HTTP + HTTPS
  - path: web-ui-svc-patch.yaml
    target:
      kind: Service
      name: web-ui

# Point all images at the BTT feature branch
images:
  - name: ghcr.io/rgconner/picker-vision/api-gateway
    newTag: feature-bobs-tiny-treasures
  - name: ghcr.io/rgconner/picker-vision/order-service
    newTag: feature-bobs-tiny-treasures
  - name: ghcr.io/rgconner/picker-vision/event-processor
    newTag: feature-bobs-tiny-treasures
  - name: ghcr.io/rgconner/picker-vision/websocket-hub
    newTag: feature-bobs-tiny-treasures
  - name: ghcr.io/rgconner/picker-vision/web-ui
    newTag: feature-bobs-tiny-treasures

labels:
  - pairs:
      app.kubernetes.io/part-of: picker-vision
      app.kubernetes.io/managed-by: kustomize
      environment: bobs-tiny-treasures
    includeSelectors: false
