---
# PersistentVolumeClaim for the SQLite database file
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-service-db
  namespace: picker-vision
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: picker-vision
  labels:
    app: order-service
spec:
  # Single replica — SQLite does not support concurrent writers across pods
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/rgconner/picker-vision/order-service:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: picker-vision-config
          volumeMounts:
            - name: db-storage
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: order-service-db
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: picker-vision
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8001
      targetPort: 8001
