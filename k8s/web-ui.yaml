---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: picker-vision
  labels:
    app: web-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: ghcr.io/rgconner/picker-vision/web-ui:main
          imagePullPolicy: Always
          env:
            - name: SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: picker-vision-config
                  key: WEB_UI_VERSION
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: nginx-config
          configMap:
            name: web-ui-nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-nginx-config
  namespace: picker-vision
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      # All backend routes proxy to the api-gateway ClusterIP Service.
      # The Service exposes port 80 (maps to container port 8000 internally).
      # Using port 80 here ensures kube-proxy iptables rules are hit correctly.

      location /api/ {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
      }

      location /state/ {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/state/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
      }

      location /stream/ {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
      }

      location /control/ {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/control/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
      }

      location /ws/ {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
      }

      location /pickers {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/pickers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
      }

      location /health {
        proxy_pass http://api-gateway.picker-vision.svc.cluster.local:80/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
      }
    }
---
# LoadBalancer Service — MetalLB assigns an external IP from the pool.
# Browsers access the React UI directly on port 80.
# The UI proxies /api, /ws, /state, /stream, and /control to the in-cluster gateway service.
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: picker-vision
  annotations:
    # Pin to a specific IP from the pool if desired, e.g.:
    # metallb.universe.tf/loadBalancerIPs: 192.168.1.201
spec:
  type: LoadBalancer
  selector:
    app: web-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
