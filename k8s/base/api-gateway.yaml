---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: picker-vision
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/rgconner/picker-vision/api-gateway:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: picker-vision-config
                  key: API_GATEWAY_VERSION
          envFrom:
            - configMapRef:
                name: picker-vision-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
# LoadBalancer Service — MetalLB assigns an external IP from the pool
# defined in metallb-config.yaml.
# Port 8000 is the single external entry point for:
#   - Pi nodes  (POST /events/detection, POST /pickers/register)
#   - Browsers  (/ws/*, /stream/*, /api/*)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: picker-vision
  annotations:
    # Pin to a specific IP from the pool if desired, e.g.:
    # metallb.universe.tf/loadBalancerIPs: 192.168.1.200
spec:
  type: LoadBalancer
  # sessionAffinity keeps a browser's WebSocket proxied through the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
