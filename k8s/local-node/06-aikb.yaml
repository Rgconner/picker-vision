# AIKB Board API — NodePort 30765
# http://192.168.1.73:30765
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aikb-data
  namespace: aikb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aikb-api
  namespace: aikb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aikb-api
  template:
    metadata:
      labels:
        app: aikb-api
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: aikb-api
          image: docker.io/library/aikb-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8765
          env:
            - name: AIKB_DB_URL
              value: "sqlite:////data/aikb.db"
            - name: AIKB_HOST
              value: "0.0.0.0"
            - name: AIKB_LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
              httpHeaders:
                - name: X-Trace-Id
                  value: liveness-probe
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
              httpHeaders:
                - name: X-Trace-Id
                  value: readiness-probe
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aikb-data
---
apiVersion: v1
kind: Service
metadata:
  name: aikb-api
  namespace: aikb
spec:
  type: NodePort
  selector:
    app: aikb-api
  ports:
    - name: http
      port: 8765
      targetPort: 8765
      nodePort: 30765
